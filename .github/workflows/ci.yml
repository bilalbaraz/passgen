name: CI/CD

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: |
          mkdir -p dist
          go build -o dist/passgen ./cmd/passgen
          mkdir -p dist/darwin_amd64
          GOOS=darwin GOARCH=amd64 go build -o dist/darwin_amd64/passgen ./cmd/passgen
          (cd dist/darwin_amd64 && zip -q ../passgen_darwin_amd64.zip passgen)
          mkdir -p dist/linux_amd64
          GOOS=linux GOARCH=amd64 go build -o dist/linux_amd64/passgen ./cmd/passgen
          (cd dist/linux_amd64 && zip -q ../passgen_linux_amd64.zip passgen)
          mkdir -p dist/linux_arm64
          GOOS=linux GOARCH=arm64 go build -o dist/linux_arm64/passgen ./cmd/passgen
          (cd dist/linux_arm64 && zip -q ../passgen_linux_arm64.zip passgen)
          VERSION="${GITHUB_REF_NAME#v}"
          for ARCH in amd64 arm64; do
            PKGROOT="dist/pkg_${ARCH}"
            rm -rf "${PKGROOT}"
            mkdir -p "${PKGROOT}/DEBIAN" "${PKGROOT}/usr/bin" "${PKGROOT}/usr/share/doc/passgen"
            install -m 755 "dist/linux_${ARCH}/passgen" "${PKGROOT}/usr/bin/passgen"
            if [ -f README.md ]; then
              install -m 644 README.md "${PKGROOT}/usr/share/doc/passgen/README.md"
            fi
            export VERSION ARCH
            envsubst < debian/control.in > "${PKGROOT}/DEBIAN/control"
            dpkg-deb --build --root-owner-group "${PKGROOT}" "dist/passgen_${VERSION}_${ARCH}.deb"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: passgen
          path: dist/passgen*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: passgen
          path: dist

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.2.4"

      - name: Sign release artifacts (keyless)
        run: |
          set -euo pipefail
          for f in dist/passgen \
                   dist/passgen_darwin_amd64.zip \
                   dist/passgen_linux_amd64.zip \
                   dist/passgen_linux_arm64.zip \
                   dist/passgen_*_amd64.deb \
                   dist/passgen_*_arm64.deb; do
            if [ -f "$f" ]; then
              cosign sign-blob --yes --output-signature "${f}.sig" "$f"
            fi
          done

      - name: Create release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/passgen
            dist/passgen_darwin_amd64.zip
            dist/passgen_linux_amd64.zip
            dist/passgen_linux_arm64.zip
            dist/passgen_*_amd64.deb
            dist/passgen_*_arm64.deb
            dist/passgen*.sig
